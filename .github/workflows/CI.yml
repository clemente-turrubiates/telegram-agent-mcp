# Originally generated by maturin v1.14.1 (`maturin generate-ci github`),
# then trimmed by hand. If you regenerate it, re-apply the changes below:
#
#   * The wheel matrix is limited to mainstream targets. This crate depends on
#     `aws-lc-sys` (via reqwest -> rustls), which needs cmake and a C toolchain
#     and does not reliably cross-compile to the musllinux / s390x / ppc64le /
#     armv7 / windows-x86 targets the generator emits by default.
#   * A `check` job (fmt + clippy + an MCP stdio smoke test) was added.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (fmt, clippy, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all
      - name: Build
        run: cargo build --workspace --release
      - name: MCP stdio smoke test
        env:
          TELEGRAM_BOT_TOKEN: dummy-token-for-startup-only
        run: |
          # Drive a real initialize + tools/list handshake over stdio and
          # assert the server identifies itself and advertises its tools.
          # This is the back-compat contract for the published wheel, which is
          # invoked with no arguments and a single token — do not change it.
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./target/release/telegram-agent-mcp 2>/dev/null > out.json
          cat out.json
          grep -q '"name":"telegram-agent-mcp"' out.json
          grep -q '"name":"wait_for_reply"' out.json
          grep -q '"name":"list_agents"' out.json

      - name: Multi-agent hub smoke test
        run: |
          # Two agents in one process. Tokens are fake, so getMe/getUpdates
          # fail harmlessly in the background; only network-free tools are
          # asserted against.
          cat > agents.toml <<'TOML'
          [[agents]]
          name = "alpha"
          token = "111:dummy-alpha"
          [[agents]]
          name = "beta"
          token = "222:dummy-beta"
          TOML
          ./target/release/telegram-agent-mcp --hub 127.0.0.1:8787 --config agents.toml &
          HUB=$!
          trap 'kill $HUB 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:8787/mcp" && break || sleep 0.5
          done

          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          hdr='-H Content-Type:application/json -H Accept:application/json,text/event-stream'

          # Both selection styles must hand out a working session.
          curl -s $hdr -D h_a.txt -o /dev/null -X POST "http://127.0.0.1:8787/mcp?agent=alpha" -d "$init"
          curl -s $hdr -D h_b.txt -o /dev/null -X POST "http://127.0.0.1:8787/mcp/beta" -d "$init"
          SA=$(grep -i '^mcp-session-id' h_a.txt | tr -d '\r' | awk '{print $2}')
          SB=$(grep -i '^mcp-session-id' h_b.txt | tr -d '\r' | awk '{print $2}')
          test -n "$SA" && test -n "$SB" && test "$SA" != "$SB"

          # An unknown agent must say so, and name the real ones.
          curl -s $hdr -D h_x.txt -o /dev/null -X POST "http://127.0.0.1:8787/mcp?agent=nope" -d "$init"
          SX=$(grep -i '^mcp-session-id' h_x.txt | tr -d '\r' | awk '{print $2}')
          call='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_chats","arguments":{}}}'
          curl -s $hdr -H "Mcp-Session-Id: $SX" -X POST "http://127.0.0.1:8787/mcp?agent=nope" -d "$call" > x.txt
          grep -q 'unknown agent' x.txt
          grep -q 'alpha, beta' x.txt

          # A selected agent resolves and the tool runs.
          curl -s $hdr -H "Mcp-Session-Id: $SA" -X POST "http://127.0.0.1:8787/mcp?agent=alpha" -d "$call" > a.txt
          grep -q '"isError":false' a.txt

      - name: Bridge smoke test
        run: |
          # stdio in, HTTP out — for clients that can only spawn a command.
          cat > agents.toml <<'TOML'
          [[agents]]
          name = "solo"
          token = "333:dummy-solo"
          TOML
          ./target/release/telegram-agent-mcp --hub 127.0.0.1:8788 --config agents.toml &
          HUB=$!
          trap 'kill $HUB 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:8788/mcp" && break || sleep 0.5
          done

          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_chats","arguments":{}}}' \
            | ./target/release/telegram-agent-mcp --connect http://127.0.0.1:8788/mcp --agent solo 2>/dev/null > bridge.json
          cat bridge.json
          grep -q '"name":"telegram-agent-mcp"' bridge.json
          # The reply to the *last* request must survive stdin closing.
          grep -q '"id":2' bridge.json

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          # Built on a native ARM runner rather than cross-compiled from x86_64.
          # The manylinux cross-gcc fails to define __ARM_ARCH when assembling
          # ring's .S files (`ARM assembler must define __ARM_ARCH`), and
          # passing -march explicitly does not fix it. Building natively avoids
          # the cross-compiler altogether.
          - runner: ubuntu-22.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    # Only publish on a version tag; the manual dispatch path still builds and
    # attests artifacts without pushing to PyPI.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [check, linux, windows, macos, sdist]
    environment: release
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish --trusted-publishing always 'wheels-*/*'
